services:
  stanza:
    # Built and published by .github/workflows/docker-publish.yml on every push to
    # main. Use `docker compose pull && docker compose up -d` to update.
    image: ghcr.io/mayberts/stanza:latest
    container_name: stanza
    restart: unless-stopped
    ports:
      - '4123:3000'
    environment:
      # Fixed at container start, so these two stay env-only — everything else
      # (rescan interval, retry/upgrade cooldowns, overwrite-existing, log
      # level, polling, ...) is tunable at runtime from the dashboard's
      # Settings page instead, and persists in /config across recreation.
      - MUSIC_DIR=/music
      - DB_PATH=/config/stanza.db
    volumes:
      # Point this at your actual music library. Needs write access so .lrc
      # files can be written alongside the tracks.
      - ${MUSIC_DIR_HOST:-./music}:/music
      # Persists the state DB across container recreation. On Unraid, point
      # this at an appdata path, e.g. /mnt/user/appdata/stanza:/config
      - ./config:/config
